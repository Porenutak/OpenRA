World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, harkonnen08.lua, harkonnen08-AI.lua
	MissionData:
		Briefing: The Ordos continue to grow in strength, thanks to their acquisition of new weaponry. The Ordos know that the wrath of the Harkonnen will soon fall upon them, and have allied with the Atreides.\n\nThis will not protect them from our Atomics. Eliminate any Atreides you encounter, but focus upon the Ordos as the main target. Smash their army, burn their structures and bring back the spoils to decorate the walls of the Palace! Capturing or destroying the Ordos Palace will show the Atreides the true might of House of Harkonnen and throw the Ordos alliance into disarray.\n\nOur scouts report a Mercenary leader inspecting a nearby Heavy Factory. If you can capture the Heavy Factory, the Mercenaries may be persuaded to join our cause. The mercenaries receive reinforcements via the Starport, so this must remain in their possession for them to be of any use.
		BriefingVideo: H_BR08_E.VQA
	MapOptions:
		TechLevel: unrestricted
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

