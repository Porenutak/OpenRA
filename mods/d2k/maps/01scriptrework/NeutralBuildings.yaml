^InfantryHealing:
	ExternalCondition@healing:
		Condition: healing
	WithDecoration@REDCROSS:
		Image: pips
		Sequence: healt_cross
		Position: BottomRight
		Margin: 5, 5
		RequiresCondition: healing && damaged
		BlinkInterval: 32
		BlinkPattern: Off, On
		ValidRelationships: Ally
	ChangesHealth@HOSPITAL:
		Step: 400
		Delay: 60
		StartIfBelow: 100
		DamageCooldown: 125
		RequiresCondition: healing
	GrantConditionOnDamageState@HOSPITAL:
		Condition: damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	GrantConditionOnPrerequisite@heal:
		Condition: hospitalheal
		Prerequisites: hospitalHealing
	ChangesHealth@HOSPITAL:
		Step: 300
		Delay: 100
		StartIfBelow: 100
		DamageCooldown: 125
		RequiresCondition: hospitalheal


^Infantry:
