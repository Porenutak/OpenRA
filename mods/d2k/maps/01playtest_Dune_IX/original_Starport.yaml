starport:
	Buildable:
		BuildDuration: 625
		Prerequisites: heavy_factory, outpost, ~techlevel.high
	Valued:
		Cost: 1500
	Health:
		HP: 45500
	D2kBuilding:
		Footprint: xxx +=+ =x=
		Dimensions: 3,3
	-ProductionAirdrop:
	ProductionFromMapEdge:
		Produces: Starport
	Production:
		Produces: Starport

carryall.reinforce_with_sound:
	Inherits: carryall.reinforce
	Health:
		HP: 11000
	-Carryall:
	Cargo:
		Types: Infantry, Vehicle
		PassengerFacing: 512
		BeforeUnloadDelay: 50
	RevealsShroud@landing:
		Range: 3c0
		RequiresCondition: !cruising
		Type: CenterPosition
	RevealsShroud@onland:
		Range: 4c0
		RequiresCondition: !airborne
		Type: CenterPosition

frigate_choam:
	Inherits: carryall.reinforce
	ParaDrop:
	RenderSprites:
		Image: frigate
	Cargo:
		MaxWeight: 20
	RejectsOrders:
	ProximityExternalCondition:
		Condition: frigate_proximity_influence
		Range: 6c0
	Aircraft:
		IdleBehavior: LeaveMapAtClosestEdge
		Speed: 170
		TurnSpeed: 4
		Repulsable: False
		MaximumPitch: 20
		CruiseAltitude: 2048
		VTOL: true
		CanHover: true
		CanSlide: true


^Starport_icon_numbers:
	WithProductionIconOverlay@order1:
