^Building:
	FireWarheadsOnDeath@sabotuerDemolition:
		RequiresCondition: being-demolished
		Type: CenterPosition
		Weapon: PlasmaSaboteur
		EmptyWeapon: PlasmaSaboteur
	AmbientSound@onSuicide:
		SoundFiles: audio/explodeSaboteurEmperor02.wav
		RequiresCondition: being-demolished
	RepairableBuilding:
		RepairStep: 300

