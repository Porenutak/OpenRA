^new_tile_undestroyable:
	Inherits@1: ^ExistsInWorld
	Inherits@2: ^SpriteActor
	FrozenUnderFog:
	WithSpriteBody:
	Building:
		TerrainTypes: Rock, Concrete, Cliff, Sand, Rock, Transition, Spice, SpiceSand, Dune
	RenderSprites:
		Palette: terrain
	Health:
		HP: 20000
	Armor:
		Type: invulnerable
	HitShape:
		UseTargetableCellsOffsets: false
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	MapEditorData:
		Categories: Tiles
	QuantizeFacingsFromSequence:
	Interactable:
	Tooltip:
		GenericName: passage
		Name: passage
		ShowOwnerRow: false

^new_tile_destroyable:
	Inherits: ^new_tile_undestroyable
	Targetable:
		TargetTypes: Ground, Cliff
		RequiresForceFire: true
	Armor:
		Type: wall
	Health:
		HP: 20000
	Tooltip:
		GenericName: pasage (Destroable)
		Name: passage (Destroable)
	OwnerLostAction:
		Action: ChangeOwner
		Owner: Neutral
	HitShape:
		UseTargetableCellsOffsets: true
	FireWarheadsOnDeath:
		Type: CenterPosition
		Weapon: cliffExplode
		EmptyWeapon: cliffExplode
	FireProjectilesOnDeath@1:
		Weapons: Debris, Debris3, Debris2
		Pieces: 0, 2
		Range: 1c0, 4c0
	FireProjectilesOnDeath@2:
		Weapons: Debris, Debris3, Debris2
		Pieces: 1, 4
		Range: 0c512, 2c0
	MapEditorData:
		Categories: Tiles-Destroable

^new_tile_destroyed:
	Inherits: ^new_tile_undestroyable
	CaptureManager:
	Building:
	OwnerLostAction:
		Action: ChangeOwner
		Owner: Neutral
	Tooltip:
		GenericName: pasage (repairable)
		Name: passage (repairable)
	CaptureManager:
	CapturableProgressBar:
	CapturableProgressBlink:
		Interval: 30
	Capturable:
		Types: cliff
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1048, -1048
			BottomRight: 1024, 1054
	Targetable:
		TargetTypes: Ground, Cliff
		RequiresForceFire: true
	MapEditorData:
		Categories: Tiles-Repairable

^BuildingHusk:
	Inherits@1: ^SpriteActor
	GrantRandomCondition:
		Conditions: decoration01, decoration02, decoration03
	Interactable:
	Health:
		HP: 15000
	Armor:
		Type: wood
	FrozenUnderFog:
	Tooltip:
		GenericName: Destroyed Building
	WithSpriteBody:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512
	MapEditorData:
		Categories: Husk
	Targetable:
		TargetTypes: Ground, Vehicle
		RequiresForceFire: true
	Building:
		Dimensions: 1,1
		Footprint: x
		TerrainTypes: Rock, Concrete
	WithColoredOverlay@darker:
		Color: 00000040
	WithBuildingBib:
	ChangesHealth:
		Step: -70
		StartIfBelow: 101
		Delay: 4
	ChangesHealth@damageidle:
		Step: -160
		StartIfBelow: 50
		Delay: 4
	Tooltip:
		Name: Building (destroyed)

