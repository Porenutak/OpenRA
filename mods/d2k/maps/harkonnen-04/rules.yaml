Player:
	PlayerResources:
		DefaultCash: 5000
	DeveloperMode:
		CheckboxEnabled: true
		CheckboxLocked: true
	ExternalCondition@AI:
		Condition: base-rebuilder-active
	ProvidesPrerequisite@autoConreteForBots:
		Prerequisite: global-auto-concrete
			RequiresCondition: base-rebuilder-active
	BaseBuilderBotModule@campaing:
		RequiresCondition: base-rebuilder-active
		BuildingQueues: Building, Upgrade
		MinimumExcessPower: 100
		MaximumExcessPower: 250
		MaxBaseRadius: 40
		ConstructionYardTypes: construction_yard
		RefineryTypes: refinery
		PowerTypes: wind_trap
		ProductionTypes: light_factory, heavy_factory, barracks, starport
		SiloTypes: silo
		DefenseTypes: medium_gun_turret,large_gun_turret
		SellRefineryInterval: -1
		BuildingLimits:
			barracks: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			wind_trap: 7
		BuildingFractions:
			wind_trap: 1
			barracks: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, harkonnen04.lua, harkonnen04-AI.lua
	MissionData:
		Briefing: The native Fremen must be dealt with. Assemble a strike force to lead a sweep through the mountains. Seek out the Fremen hold, and destroy it. If any House responds, destroy it.\n\nTanks have been deployed to grind the Fremen beneath their treads. Demonstrate the power of House Harkonnen.
		BriefingVideo: H_BR04_E.VQA
	MapOptions:
		TechLevel: low
		GameSpeed: fastest
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: hard

